name: Huellitas CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Verificar sintaxis
        run: find src -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Pruebas y cobertura
        run: |
          set -o pipefail
          node --test --experimental-test-coverage --test-coverage-exclude='test/**' | tee cobertura.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: server/cobertura.txt
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist
